# Project name normalization for obsidian_sync_core.normalize_project().
# First match wins; all keywords must appear in the lowercased name.

junk_patterns:
  - "untitled"
  - "generated by:"
  - "query:"

rules:
  - keywords: ["fyta"]
    canonical: "FYTA Plant App and Sensor Flows"
  - keywords: ["thermax"]
    canonical: "Thermax EDGE B2B Asset Tracking Redesign"
  - keywords: ["edge", "asset"]
    canonical: "Thermax EDGE B2B Asset Tracking Redesign"
  - keywords: ["icici"]
    canonical: "ICICI Bank Web and Mobile Fintech Modules"
  - keywords: ["locker"]
    canonical: "ICICI Bank Web and Mobile Fintech Modules"
  - keywords: ["retirement"]
    canonical: "ICICI Bank Web and Mobile Fintech Modules"
  - keywords: ["architect"]
    canonical: "Architecture Practice (Healthcare, Residential, Government)"
